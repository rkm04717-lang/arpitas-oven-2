<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arpita's Oven — Something Sweet Is Baking</title>

  <meta
    name="description"
    content="Welcome to Arpita's Oven — home-baked cakes made with love for moments worth remembering."
  >

  <link rel="stylesheet" href="css/style.css">

  <!-- Arpita's Oven logo as favicon -->
  <link rel="icon" type="image/png" href="logo.png">
</head>

<body class="entrance-page">

  <main class="entrance">

    <div class="entrance-glow"></div>

    <div class="entrance-content">

      <!-- Arpita's Oven Logo -->
      <img
        src="logo.png"
        alt="Arpita's Oven Logo"
        class="site-logo"
      >

      <p class="tiny-label">
        HOME-BAKED SINCE 2021
      </p>

      <h1>
        Arpita's<br>
        <em>Oven</em>
      </h1>

      <div class="divider"></div>

      <p class="entrance-message">
        Something sweet<br>
        is baking.
      </p>

      <p class="entrance-sub">
        Come in. There's always room for one more slice.
      </p>

      <a href="oven.html" class="oven-button">
        <span>🔥</span>
        Enter the Oven
        <span class="arrow">→</span>
      </a>

      <p class="entrance-note">
        Take your time. We saved you a seat.
      </p>

    </div>

    <div class="floating-crumb crumb-one">✦</div>
    <div class="floating-crumb crumb-two">·</div>
    <div class="floating-crumb crumb-three">✦</div>

  </main>

  <script src="js/main.js"></script>
