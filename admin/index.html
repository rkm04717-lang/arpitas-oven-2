<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin — Arpita's Oven</title>

  <meta
    name="robots"
    content="noindex, nofollow"
  >

<!-- FAVICON -->
<link
  rel="icon"
  type="image/png"
  href="../logo.png"
>
  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --cream: #fff8f1;
      --cream-dark: #f5e9dd;

      --brown: #33231e;
      --brown-soft: #6d554c;

      --peach: #e9a28f;

      --white: #ffffff;

      --danger: #b94b4b;
      --success: #47734d;

      --border: #dfd1c5;

    }


    body {

      margin: 0;

      background: var(--cream);

      color: var(--brown);

      font-family:
        Arial,
        sans-serif;

    }


    button,
    input,
    textarea,
    select {

      font: inherit;

    }


    button {

      cursor: pointer;

    }


    /* =================================
       HEADER
       ================================= */

    .admin-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 22px 5%;

      background: var(--white);

      border-bottom:
        1px solid #eaded4;

    }


    .admin-title {

      font-family:
        Georgia,
        serif;

      font-size: 28px;

    }


    .admin-title span {

      font-size: 12px;

      font-family:
        Arial,
        sans-serif;

      color:
        var(--brown-soft);

      margin-left: 8px;

    }



    /* =================================
       CONTENT
       ================================= */

    .dashboard-content {

      width:
        min(1100px, 90%);

      margin:
        0 auto;

      padding:
        50px 0 80px;

    }


    .dashboard-heading {

      margin-bottom: 30px;

    }


    .dashboard-heading h1 {

      margin:
        0 0 8px;

      font-family:
        Georgia,
        serif;

      font-size: 42px;

      font-weight: 400;

    }


    .dashboard-heading p {

      margin: 0;

      color:
        var(--brown-soft);

    }



    /* =================================
       GRID
       ================================= */

    .admin-grid {

      display: grid;

      grid-template-columns:
        1fr 1.4fr;

      gap: 30px;

      align-items: start;

    }



    /* =================================
       PANELS
       ================================= */

    .panel {

      background:
        var(--white);

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 12px 40px
        rgba(51, 35, 30, 0.07);

    }


    .panel h2 {

      margin-top: 0;

      font-family:
        Georgia,
        serif;

      font-size: 27px;

      font-weight: 400;

    }



    /* =================================
       FORM
       ================================= */

    .field {

      margin-bottom: 18px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 13px;

      font-weight: 700;

    }


    input,
    textarea,
    select {

      width: 100%;

      border:
        1px solid var(--border);

      background:
        #fff;

      color:
        var(--brown);

      border-radius: 10px;

      padding:
        13px 14px;

      outline: none;

    }


    input:focus,
    textarea:focus,
    select:focus {

      border-color:
        var(--brown);

    }


    textarea {

      min-height: 110px;

      resize: vertical;

    }



    /* =================================
       IMAGE UPLOAD
       ================================= */

    .image-upload-box {

      border:
        2px dashed #d9c8bb;

      border-radius: 14px;

      padding: 22px;

      text-align: center;

      background:
        #fffaf6;

      transition:
        border-color 0.2s ease,
        background 0.2s ease;

    }


    .image-upload-box:hover {

      border-color:
        var(--peach);

      background:
        #fff7f1;

    }


    .upload-icon {

      font-size: 34px;

      margin-bottom: 8px;

    }


    .upload-title {

      font-weight: 700;

      margin-bottom: 5px;

    }


    .upload-subtitle {

      color:
        var(--brown-soft);

      font-size: 12px;

      margin-bottom: 15px;

    }


    .file-input {

      display: none;

    }


    .choose-image-button {

      display: inline-block;

      padding:
        10px 16px;

      border-radius: 9px;

      background:
        var(--brown);

      color:
        white;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

    }


    .choose-image-button:hover {

      opacity: 0.9;

    }



    /* =================================
       IMAGE PREVIEW
       ================================= */

    .image-preview-wrapper {

      display: none;

      margin-top: 18px;

    }


    .image-preview-wrapper.visible {

      display: block;

    }


    .image-preview {

      display: block;

      width: 100%;

      max-height: 280px;

      object-fit: cover;

      border-radius: 12px;

      border:
        1px solid #eaded4;

    }


    .image-preview-info {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-top: 10px;

    }


    .image-file-name {

      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      color:
        var(--brown-soft);

      font-size: 12px;

    }


    .remove-image-button {

      flex-shrink: 0;

      border:
        1px solid #e0c9c0;

      background:
        white;

      color:
        var(--danger);

      padding:
        7px 10px;

      border-radius: 7px;

      font-size: 12px;

    }



    /* =================================
       PRIMARY BUTTON
       ================================= */

    .primary-button {

      width: 100%;

      border: 0;

      border-radius: 10px;

      padding:
        14px 18px;

      background:
        var(--brown);

      color:
        white;

      cursor: pointer;

      font-weight: 700;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

    }


    .primary-button:hover {

      opacity: 0.9;

      transform:
        translateY(-1px);

    }


    .primary-button:disabled {

      opacity: 0.55;

      cursor: not-allowed;

      transform: none;

    }



    /* =================================
       CAKE LIST
       ================================= */

    .cake-list {

      display: grid;

      gap: 14px;

    }


    .cake-item {

      padding: 16px;

      border:
        1px solid #eaded4;

      border-radius: 12px;

    }


    .cake-item-inner {

      display: flex;

      gap: 15px;

      align-items: flex-start;

    }


    .cake-thumbnail {

      width: 90px;

      height: 90px;

      flex-shrink: 0;

      object-fit: cover;

      border-radius: 10px;

      background:
        var(--cream-dark);

    }


    .cake-item-content {

      flex: 1;

      min-width: 0;

    }


    .cake-item h3 {

      margin:
        0 0 5px;

      font-family:
        Georgia,
        serif;

      font-size: 21px;

      font-weight: 400;

    }


    .cake-item p {

      margin:
        5px 0;

      color:
        var(--brown-soft);

      font-size: 13px;

    }


    .cake-item-actions {

      display: flex;

      gap: 8px;

      margin-top: 12px;

    }


    .small-button {

      border:
        1px solid #d9cbc0;

      background:
        white;

      color:
        var(--brown);

      padding:
        8px 11px;

      border-radius: 7px;

      cursor: pointer;

      font-size: 12px;

    }


    .delete-button {

      color:
        var(--danger);

    }


    .empty-state {

      padding:
        30px 10px;

      text-align: center;

      color:
        var(--brown-soft);

      font-size: 14px;

    }


    .status {

      margin-top: 15px;

      font-size: 13px;

      color:
        var(--success);

      min-height: 18px;

    }



    /* =================================
       MOBILE
       ================================= */

    @media (max-width: 850px) {

      .admin-grid {

        grid-template-columns:
          1fr;

      }


      .admin-header {

        padding:
          18px 5%;

      }


      .dashboard-heading h1 {

        font-size:
          34px;

      }

    }


    @media (max-width: 500px) {

      .admin-title span {

        display: none;

      }


      .panel {

        padding:
          22px;

      }


      .cake-item-inner {

        flex-direction:
          column;

      }


      .cake-thumbnail {

        width: 100%;

        height: 180px;

      }

    }

  </style>

</head>


<body>


<!-- =================================
     HEADER
     ================================= -->

<header class="admin-header">

  <div class="admin-title">

    Arpita's Oven

    <span>
      Admin Kitchen
    </span>

  </div>

</header>



<!-- =================================
     DASHBOARD
     ================================= -->

<main class="dashboard-content">


  <div class="dashboard-heading">

    <h1>
      The Kitchen.
    </h1>

    <p>
      Manage what's baking at Arpita's Oven.
    </p>

  </div>



  <div class="admin-grid">


    <!-- =================================
         ADD CAKE
         ================================= -->

    <section class="panel">

      <h2>
        Add a cake
      </h2>


      <form id="cakeForm">


        <!-- CAKE NAME -->

        <div class="field">

          <label for="cakeName">
            Cake name
          </label>

          <input
            id="cakeName"
            required
            placeholder="Chocolate Truffle"
          >

        </div>



        <!-- CATEGORY -->

        <div class="field">

          <label for="cakeCategory">
            Category
          </label>

          <input
            id="cakeCategory"
            placeholder="The Classic"
          >

        </div>



        <!-- DESCRIPTION -->

        <div class="field">

          <label for="cakeDescription">
            Description
          </label>

          <textarea
            id="cakeDescription"
            placeholder="A rich chocolate cake layered with creamy chocolate truffle..."
          ></textarea>

        </div>



        <!-- PRICE -->

        <div class="field">

          <label for="cakePrice">
            Price
          </label>

          <input
            id="cakePrice"
            placeholder="Starting from ₹850"
          >

        </div>



        <!-- IMAGE -->

        <div class="field">

          <label>
            Cake image
          </label>


          <div
            class="image-upload-box"
            id="imageUploadBox"
          >

            <div class="upload-icon">
              📸
            </div>


            <div class="upload-title">
              Add your cake photo
            </div>


            <div class="upload-subtitle">
              Choose an image directly from your computer
            </div>


            <label
              for="cakeImageFile"
              class="choose-image-button"
            >
              Choose Image
            </label>


            <input
              id="cakeImageFile"
              class="file-input"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif"
            >


            <!-- PREVIEW -->

            <div
              id="imagePreviewWrapper"
              class="image-preview-wrapper"
            >

              <img
                id="imagePreview"
                class="image-preview"
                alt="Cake image preview"
              >


              <div class="image-preview-info">

                <span
                  id="imageFileName"
                  class="image-file-name"
                ></span>


                <button
                  type="button"
                  id="removeImageButton"
                  class="remove-image-button"
                >
                  Remove
                </button>

              </div>

            </div>

          </div>

        </div>



        <!-- DISPLAY ORDER -->

        <div class="field">

          <label for="cakeOrder">
            Display order
          </label>

          <input
            id="cakeOrder"
            type="number"
            value="0"
          >

        </div>



        <!-- ADD BUTTON -->

        <button
          id="addCakeButton"
          class="primary-button"
          type="submit"
        >
          Add Cake
        </button>


        <div
          id="cakeStatus"
          class="status"
        ></div>


      </form>

    </section>



    <!-- =================================
         CURRENT BATCH
         ================================= -->

    <section class="panel">

      <h2>
        Current batch
      </h2>


      <div
        id="cakeList"
        class="cake-list"
      >

        <div class="empty-state">
          Loading cakes...
        </div>

      </div>

    </section>


  </div>


</main>



<script>


/* =================================
   ELEMENTS
   ================================= */

const cakeForm =
  document.getElementById(
    "cakeForm"
  );


const cakeList =
  document.getElementById(
    "cakeList"
  );


const cakeStatus =
  document.getElementById(
    "cakeStatus"
  );


const cakeImageFile =
  document.getElementById(
    "cakeImageFile"
  );


const imagePreview =
  document.getElementById(
    "imagePreview"
  );


const imagePreviewWrapper =
  document.getElementById(
    "imagePreviewWrapper"
  );


const imageFileName =
  document.getElementById(
    "imageFileName"
  );


const removeImageButton =
  document.getElementById(
    "removeImageButton"
  );


const addCakeButton =
  document.getElementById(
    "addCakeButton"
  );


/* =================================
   SELECTED IMAGE DATA
   ================================= */

let selectedImageData = "";


/* =================================
   API HELPER
   ================================= */

async function api(
  url,
  options = {}
) {

  try {

    const response =
      await fetch(
        url,
        {
          ...options
        }
      );


    let data = {};


    try {

      data =
        await response.json();

    } catch {

      data = {};

    }


    return {
      response,
      data
    };

  } catch (error) {

    return {

      response: null,

      data: {

        success: false,

        message:
          "Could not connect to the server."

      }

    };

  }

}



/* =================================
   IMAGE FILE → DATA URL
   ================================= */

cakeImageFile.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];


    if (!file) {

      return;

    }


    /*
      Maximum image size for the
      browser-side conversion.
    */

    const maxSize =
      8 * 1024 * 1024;


    if (
      file.size > maxSize
    ) {

      alert(
        "Please choose an image smaller than 8 MB."
      );


      this.value = "";

      return;

    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      alert(
        "Please choose an image file."
      );


      this.value = "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload = function (
      event
    ) {

      selectedImageData =
        event.target.result;


      imagePreview.src =
        selectedImageData;


      imageFileName.textContent =
        file.name;


      imagePreviewWrapper.classList.add(
        "visible"
      );

    };


    reader.onerror = function () {

      alert(
        "Could not read this image."
      );

    };


    reader.readAsDataURL(
      file
    );

  }
);



/* =================================
   REMOVE IMAGE
   ================================= */

removeImageButton.addEventListener(
  "click",
  function () {

    selectedImageData = "";

    cakeImageFile.value = "";

    imagePreview.src = "";

    imageFileName.textContent = "";

    imagePreviewWrapper.classList.remove(
      "visible"
    );

  }
);



/* =================================
   LOAD CAKES
   ================================= */

async function loadCakes() {

  cakeList.innerHTML = `
    <div class="empty-state">
      Loading cakes...
    </div>
  `;


  const result =
    await api(
      "/api/cakes"
    );


  if (
    !result.data.success
  ) {

    cakeList.innerHTML = `
      <div class="empty-state">
        Could not load cakes.
      </div>
    `;

    return;

  }


  const cakes =
    result.data.cakes || [];


  if (
    cakes.length === 0
  ) {

    cakeList.innerHTML = `
      <div class="empty-state">
        The tray is empty.<br>
        Add your first cake.
      </div>
    `;

    return;

  }


  cakeList.innerHTML = "";


  cakes.forEach(
    (cake) => {

      const item =
        document.createElement(
          "article"
        );


      item.className =
        "cake-item";


      const image =
        cake.image_url
          ? `
            <img
              class="cake-thumbnail"
              src="${escapeHtml(
                cake.image_url
              )}"
              alt="${escapeHtml(
                cake.name
              )}"
            >
          `
          : `
            <div
              class="cake-thumbnail"
            ></div>
          `;


      item.innerHTML = `

        <div class="cake-item-inner">

          ${image}

          <div class="cake-item-content">

            <h3>
              ${escapeHtml(
                cake.name
              )}
            </h3>

            <p>
              ${escapeHtml(
                cake.category ||
                "No category"
              )}
            </p>

            <p>
              ${escapeHtml(
                cake.price ||
                "Price not set"
              )}
            </p>

            <p>
              ${escapeHtml(
                cake.description ||
                ""
              )}
            </p>

            <div
              class="cake-item-actions"
            >

              <button
                class="small-button delete-button"
                type="button"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

      `;


      const deleteButton =
        item.querySelector(
          ".delete-button"
        );


      deleteButton.addEventListener(
        "click",
        () => {

          deleteCake(
            cake.id
          );

        }
      );


      cakeList.appendChild(
        item
      );

    }
  );

}



/* =================================
   DELETE CAKE
   ================================= */

async function deleteCake(
  id
) {

  const confirmed =
    confirm(
      "Remove this cake from the catalogue?"
    );


  if (!confirmed) {

    return;

  }


  const result =
    await api(
      `/api/cakes/${id}`,
      {
        method:
          "DELETE"
      }
    );


  if (
    result.data.success
  ) {

    loadCakes();

  } else {

    alert(
      result.data.message ||
      "Could not delete the cake."
    );

  }

}



/* =================================
   ADD CAKE
   ================================= */

cakeForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();


    /*
      Require an image.
    */

    if (
      !selectedImageData
    ) {

      cakeStatus.textContent =
        "Please choose a cake image first.";

      cakeStatus.style.color =
        "#b94b4b";

      return;

    }


    cakeStatus.textContent =
      "Adding cake...";


    cakeStatus.style.color =
      "#47734d";


    addCakeButton.disabled =
      true;


    const cake = {

      name:
        document
          .getElementById(
            "cakeName"
          )
          .value
          .trim(),

      category:
        document
          .getElementById(
            "cakeCategory"
          )
          .value
          .trim(),

      description:
        document
          .getElementById(
            "cakeDescription"
          )
          .value
          .trim(),

      price:
        document
          .getElementById(
            "cakePrice"
          )
          .value
          .trim(),

      /*
        The selected PC image is
        converted to a data URL.
      */

      image_url:
        selectedImageData,

      display_order:
        Number(
          document
            .getElementById(
              "cakeOrder"
            )
            .value || 0
        ),

      available:
        true

    };


    const result =
      await api(
        "/api/cakes",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              cake
            )

        }
      );


    addCakeButton.disabled =
      false;


    if (
      !result.data.success
    ) {

      cakeStatus.textContent =
        result.data.message ||
        "Could not add cake.";

      cakeStatus.style.color =
        "#b94b4b";

      return;

    }


    cakeForm.reset();


    document
      .getElementById(
        "cakeOrder"
      )
      .value = "0";


    selectedImageData =
      "";

    imagePreview.src =
      "";

    imageFileName.textContent =
      "";

    imagePreviewWrapper.classList.remove(
      "visible"
    );


    cakeStatus.textContent =
      "Cake added to the batch.";

    cakeStatus.style.color =
      "#47734d";


    loadCakes();

  }
);



/* =================================
   HTML ESCAPE
   ================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =================================
   START
   ================================= */

loadCakes();

</script>


</body>

</html>
